name: Repair stuck Pages publication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/repair-pages.yml]
permissions:
  contents: read
  pages: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Reset inconsistent Pages deployment state
        uses: actions/github-script@v7
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: pages } = await github.request('GET /repos/{owner}/{repo}/pages', repo);
            if (pages.cname) throw new Error('Refusing to reset a custom-domain site.');
            if (pages.source?.branch !== 'main' || pages.source?.path !== '/') {
              throw new Error('Unexpected Pages source; refusing to replace it.');
            }
            await github.request('DELETE /repos/{owner}/{repo}/pages', repo);
            await github.request('POST /repos/{owner}/{repo}/pages', {
              ...repo, build_type: 'legacy', source: pages.source
            });
            core.info('Restored Pages from main / with a fresh deployment state.');
